<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>India AI/ML Job Market Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script><style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101a2a;--line:#26364d;--text:#eef4ff;--muted:#9aabc2;--cyan:#5eead4;--blue:#7aa7ff;--amber:#fbbf65}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#172b48 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:34px 20px 60px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}h1{font-size:clamp(32px,5vw,54px);line-height:1.04;letter-spacing:-.04em;margin:12px 0}.muted,p{color:var(--muted)}a{color:var(--cyan);text-decoration:none}.notice{padding:14px 16px;border:1px solid #6c5532;background:#30251566;border-radius:12px;color:#f5d9a8;margin:22px 0;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.metric,.panel{background:linear-gradient(145deg,var(--panel),#0d1523);border:1px solid var(--line);border-radius:16px;padding:18px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:30px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel h2{font-size:15px;margin:0 0 12px}.chart{height:260px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{background:#101a2a;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:9px;min-width:170px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:850px;border-collapse:collapse;background:#0e1726}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #1d2a3d;font-size:13px}th{background:#17243a;color:#b9c9df;position:sticky;top:0}td{color:#dbe6f5}.pill{display:inline-block;background:#1b3444;color:#9ff2e2;border-radius:20px;padding:3px 8px;font-size:11px}footer{font-size:12px;color:var(--muted);margin-top:22px}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:420px){main{padding:22px 13px}}</style></head><body><main><div class="eyebrow">Research workspace · India · 2026</div><h1>AI / ML Job Market<br>Explorer</h1><p>A visual companion to your Notion job tracker: role mix, location patterns, recorded status and compensation information.</p><p class="muted">Snapshot: 13 November 2026 · <a href="https://app.notion.com/p/b27904c4cf1543bdbd53dd8099ac9017" target="_blank">Open Notion source ↗</a></p><div class="notice"><b>Important:</b> this is a personal tracker snapshot, not a live vacancy feed or a representative census of Indian jobs. Some entries have old or unverified status checks. Verify each vacancy on the employer's official careers page. “Not disclosed” does not mean unpaid.</div><section class="metrics"><div class="metric"><small>Records in this snapshot</small><strong id="n">—</strong></div><div class="metric"><small>Companies</small><strong id="co">—</strong></div><div class="metric"><small>Compensation details</small><strong id="pay">—</strong></div><div class="metric"><small>Fit scores</small><strong id="score">—</strong></div></section><section class="grid"><div class="panel"><h2>Role categories</h2><div class="chart"><canvas id="roles"></canvas></div></div><div class="panel"><h2>Locations</h2><div class="chart"><canvas id="loc"></canvas></div></div><div class="panel"><h2>Recorded status</h2><div class="chart"><canvas id="status"></canvas></div></div><div class="panel"><h2>Compensation disclosure</h2><div class="chart"><canvas id="paychart"></canvas></div></div></section><h2 style="margin-top:30px">Role explorer</h2><div class="toolbar"><input id="search" placeholder="Search role or company"><select id="cat"><option value="">All categories</option></select><select id="city"><option value="">All locations</option></select></div><div class="tablewrap"><table><thead><tr><th>Role / company</th><th>Category</th><th>Location</th><th>Experience</th><th>Compensation</th><th>Fit</th><th>Status</th><th>Apply</th></tr></thead><tbody id="rows"></tbody></table></div><footer>Source: <a href="https://app.notion.com/p/b27904c4cf1543bdbd53dd8099ac9017">AI/ML India — Hourly Job Tracker</a>. Dashboard shows only the first 99 rows retrieved for this build. More database records exist; this initial snapshot is not exhaustive.</footer></main><script>
const colors=['#5eead4','#7aa7ff','#fbbf65','#c4a7ff','#fb8caa','#9bd18b','#f29b72','#8bc5ed'];let data=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chart(id,items){new Chart(document.getElementById(id),{type:'bar',data:{labels:items.map(x=>x[0]),datasets:[{data:items.map(x=>x[1]),backgroundColor:colors,borderRadius:5}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9aabc2'},grid:{color:'#26364d'}},y:{ticks:{color:'#cbd7e8'},grid:{color:'#26364d'}}}}})}
function draw(){const q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('cat').value,l=document.getElementById('city').value;let a=data.filter(r=>(!q||(r.role+' '+r.company).toLowerCase().includes(q))&&(!c||r.category===c)&&(!l||r.location===l));document.getElementById('rows').innerHTML=a.map(r=>'<tr><td><b>'+esc(r.role)+'</b><br><span class="muted">'+esc(r.company)+'</span></td><td>'+esc(r.category)+'</td><td>'+esc(r.location)+'</td><td>'+esc((r.experience||[]).join('; ')||'—')+'</td><td>'+esc(r.compensation)+'</td><td>'+(r.fit_score??'—')+'</td><td><span class="pill">'+esc(r.status)+'</span></td><td>'+(r.application_link?'<a target="_blank" rel="noreferrer" href="'+esc(r.application_link)+'">Open ↗</a>':'—')+'</td></tr>').join('')}
fetch('./data/jobs.json').then(r=>r.json()).then(d=>{data=d.records;document.getElementById('n').textContent=data.length;document.getElementById('co').textContent=new Set(data.map(r=>r.company).filter(x=>x!=='Not specified')).size;document.getElementById('pay').textContent=data.filter(r=>r.compensation&&!/not disclosed/i.test(r.compensation)).length;document.getElementById('score').textContent=data.filter(r=>r.fit_score!==null).length;for(const [id,key] of [['cat','category'],['city','location']]){[...new Set(data.map(r=>r[key]))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;document.getElementById(id).append(o)})}const counts=k=>Object.entries(data.reduce((m,r)=>{let v=r[k]||'Not specified';m[v]=(m[v]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]).slice(0,10);chart('roles',counts('category'));chart('loc',counts('location'));chart('status',counts('status'));let disclosed=data.filter(r=>r.compensation&&!/not disclosed/i.test(r.compensation)).length;chart('paychart',[['Some detail recorded',disclosed],['Not disclosed',data.length-disclosed]]);draw();['search','cat','city'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',draw))}).catch(()=>document.querySelector('main').insertAdjacentHTML('beforeend','<p class="notice">Could not load the snapshot data. Refresh the page.</p>'));
<\/script></body></html>
